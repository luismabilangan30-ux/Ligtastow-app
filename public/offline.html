<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f04424" />
  <title>LigtasTow — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: #f7f6f2; color: #202321;
      min-height: 100dvh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; text-align: center;
      padding: 40px 24px;
    }
    .icon {
      width: 80px; height: 80px; margin-bottom: 24px;
      background: #fff0eb; border-radius: 50%;
      display: grid; place-items: center;
    }
    .icon svg { width: 36px; height: 36px; color: #f04424; }
    h1 { font-size: 22px; margin-bottom: 8px; letter-spacing: -.5px; }
    p { font-size: 14px; color: #707772; line-height: 1.6; max-width: 320px; margin-bottom: 24px; }
    button {
      background: #f04424; color: white; border: none;
      padding: 14px 32px; border-radius: 12px;
      font-size: 15px; font-weight: 700; cursor: pointer;
      min-height: 48px;
    }
    button:active { background: #cf3218; }
    .brand { font-size: 12px; color: #a0a5a0; margin-top: 40px; font-weight: 600; letter-spacing: .5px; }
  </style>
</head>
<body>
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <line x1="1" y1="1" x2="23" y2="23"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/>
    </svg>
  </div>
  <h1>You're offline</h1>
  <p>LigtasTow needs an internet connection to find operators and update your bookings. Check your connection and try again.</p>
  <button onclick="window.location.reload()">Try again</button>
  <p class="brand">LIGTASTOW</p>
</body>
</html>
